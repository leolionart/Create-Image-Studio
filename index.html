<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121316" />
    <title>Creative Image Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        /* === Fonts === */
        --font-sans: 'Roboto', system-ui, -apple-system, sans-serif;
        --font-mono: 'Roboto Mono', monospace;

        /* === M3 Dark Theme — seed: #4285F4 (Google Blue) === */
        --color-primary: #A8C7FA;
        --color-primary-container: #0842A0;
        --color-on-primary: #062E6F;
        --color-on-primary-container: #D3E3FD;

        --color-secondary: #BEC6DC;
        --color-secondary-container: #3E4759;
        --color-on-secondary: #283141;
        --color-on-secondary-container: #DAE2F9;

        --color-tertiary: #D4BEE6;
        --color-tertiary-container: #503D6A;
        --color-on-tertiary: #392653;
        --color-on-tertiary-container: #EDDDF9;

        --color-error: #FFB4AB;
        --color-error-container: #93000A;
        --color-on-error: #690005;
        --color-on-error-container: #FFDAD6;

        --color-surface: #121316;
        --color-surface-dim: #121316;
        --color-surface-bright: #38393D;
        --color-surface-variant: #44474F;
        --color-surface-container-lowest: #0D0E11;
        --color-surface-container-low: #1B1B1F;
        --color-surface-container: #1F1F23;
        --color-surface-container-high: #292A2E;
        --color-surface-container-highest: #343539;

        --color-on-surface: #E3E2E6;
        --color-on-surface-variant: #C4C6D0;

        --color-outline: #8E9099;
        --color-outline-variant: #44474F;

        --color-inverse-surface: #E3E2E6;
        --color-inverse-on-surface: #2F3034;
        --color-inverse-primary: #0B57D0;

        --color-scrim: #000000;

        /* === M3E Border Radius === */
        --radius-none: 0px;
        --radius-xs: 4px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --radius-2xl: 24px;
        --radius-3xl: 28px;
        --radius-4xl: 32px;
        --radius-full: 9999px;

        /* === M3E Elevation Shadows === */
        --shadow-elevation-1: 0px 1px 2px 0px rgba(0,0,0,0.30), 0px 1px 3px 1px rgba(0,0,0,0.15);
        --shadow-elevation-2: 0px 1px 2px 0px rgba(0,0,0,0.30), 0px 2px 6px 2px rgba(0,0,0,0.15);
        --shadow-elevation-3: 0px 1px 3px 0px rgba(0,0,0,0.30), 0px 4px 8px 3px rgba(0,0,0,0.15);

        /* === Transition Timing === */
        --ease-md-standard: cubic-bezier(0.2, 0, 0, 1);
        --ease-md-emphasized: cubic-bezier(0.2, 0, 0, 1);
        --ease-md-decelerate: cubic-bezier(0, 0, 0, 1);
        --ease-md-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

        /* === Animations === */
        --animate-fade-in: fadeIn 200ms cubic-bezier(0.2, 0, 0, 1);
        --animate-slide-up: slideUp 300ms cubic-bezier(0.2, 0, 0, 1);
        --animate-slide-down: slideDown 250ms cubic-bezier(0.2, 0, 0, 1);
        --animate-scale-in: scaleIn 250ms cubic-bezier(0.34, 1.56, 0.64, 1);
        --animate-card-in: cardIn 400ms cubic-bezier(0.34, 1.56, 0.64, 1) both;

        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes slideUp {
          from { transform: translateY(100%); }
          to { transform: translateY(0); }
        }
        @keyframes slideDown {
          from { transform: translateY(-12px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scaleIn {
          from { transform: scale(0.92); opacity: 0; }
          to { transform: scale(1); opacity: 1; }
        }
        @keyframes cardIn {
          from { transform: translateY(20px) scale(0.96); opacity: 0; }
          to { transform: translateY(0) scale(1); opacity: 1; }
        }
      }

      /* M3 scrollbar styling */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #44474F; border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #8E9099; border: 2px solid transparent; background-clip: content-box; }
      * { scrollbar-width: thin; scrollbar-color: #44474F transparent; }
      body { overflow: hidden; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* M3E shimmer skeleton */
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      /* M3E card transition — explicit shorthand to avoid v4 composability issues */
      .transition-card {
        transition: transform 300ms var(--ease-spring), box-shadow 300ms var(--ease-spring);
      }

      /* Material Symbols config */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
